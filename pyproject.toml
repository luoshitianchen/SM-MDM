[project]
name = "SM-MDM"
version = "2.0.0"
description = "主数据管理：数据域、主数据、黄金记录与去重合并"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
